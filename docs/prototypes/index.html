      * { transition: none !important; }
    }

    function downsampleToPcm(chunks, inputRate) {
      const total = chunks.reduce((n, c) => n + c.length, 0);
      const merged = new Float32Array(total);
      let offset = 0;
      chunks.forEach((chunk) => { merged.set(chunk, offset); offset += chunk.length; });
      const ratio = inputRate / 16000;
      const length = Math.floor(merged.length / ratio);
      const pcm = new Int16Array(length);
      for (let i = 0; i < length; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(merged.length, Math.floor((i + 1) * ratio));
        let sum = 0;
        for (let j = start; j < end; j++) sum += merged[j];
        const sample = Math.max(-1, Math.min(1, sum / Math.max(1, end - start)));
        pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      return pcm.buffer;
    }

      if (micSession) { await finishVoice(); return; }
      if (location.protocol === "file:") {
        state.composer.voiceNote = "请用本地语音服务打开页面后再试。";
        save(); render(); return;
      }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) {
        state.composer.voiceNote = "没有拿到麦克风权限。请允许浏览器使用麦克风后再试。";
        save(); render(); return;
      }
      const ctx = new AudioContext();
      const source = ctx.createMediaStreamSource(stream);
      const processor = ctx.createScriptProcessor(4096, 1, 1);
      const gain = ctx.createGain();
      gain.gain.value = 0;
      const chunks = [];
      processor.onaudioprocess = (event) => { chunks.push(new Float32Array(event.inputBuffer.getChannelData(0))); };
      source.connect(processor);
      processor.connect(gain);
      gain.connect(ctx.destination);
      micSession = { stream, ctx, source, processor, gain, chunks, rate: ctx.sampleRate };
      state.composer.listening = true;
      state.composer.voiceNote = "正在听。再点一次麦克风，结束并转成文字。";
      save(); render();
    }
    async function finishVoice() {
      const current = micSession;
      micSession = null;
      state.composer.listening = false;
      if (!current) return;
      current.processor.onaudioprocess = null;
      current.processor.disconnect();
      current.source.disconnect();
      current.gain.disconnect();
      current.stream.getTracks().forEach((track) => track.stop());
      const rate = current.rate;
      const chunks = current.chunks;
      await current.ctx.close();
      const draft = document.getElementById("draft");
      if (draft) state.composer.text = draft.value;
      state.composer.voiceNote = "正在识别。";
      save(); render();
      try {
        const pcm = downsampleToPcm(chunks, rate);
        const response = await fetch("/api/asr", { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: pcm });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "语音识别没有完成");
        if (!data.text) throw new Error("没有识别到文字。");
        const existing = state.composer.text || "";
        const gap = existing && /[A-Za-z0-9]$/.test(existing) && /^[A-Za-z0-9]/.test(data.text) ? " " : "";
        state.composer.text = existing + gap + data.text;
        state.composer.voiceNote = "";
      } catch (e) {
        state.composer.voiceNote = "语音识别没有完成：" + (e && e.message ? e.message : "请再试一次");
      }
      save(); render();
    }
    document.getElementById("app").addEventListener("focusin", (event) => {
      if (event.target.id !== "email") return;
      const field = event.target.closest(".login-field");
      if (field) field.classList.add("open");
    });
    document.getElementById("app").addEventListener("mousedown", (event) => {
      const option = event.target.closest("[data-act='pick-email']");
      if (!option) return;
      event.preventDefault();
      state.email = option.dataset.email;
      const input = document.getElementById("email");
      if (input) input.value = state.email;
      const field = option.closest(".login-field");
      if (field) field.classList.remove("open");
      save();
    });
    document.getElementById("app").addEventListener("focusout", (event) => {
      const field = event.target.closest && event.target.closest(".login-field");
      if (!field || !field.classList.contains("open")) return;
      if (event.relatedTarget && field.contains(event.relatedTarget)) return;
      field.classList.remove("open");
    });
    document.getElementById("app").addEventListener("click", (event) => {
      if (!event.target.closest(".history-more, .history-pop") && state.historyMenuId) {
        state.historyMenuId = "";
        if (!event.target.closest("[data-act], [data-plugin], [data-go], [data-decision]")) { save(); render(); return; }
      }
      if (event.target.id === "email") {
        const field = event.target.closest(".login-field");
        if (field) field.classList.add("open");
      }
      const plugin = event.target.closest("[data-plugin]");
      if (plugin) { state.composer.plugin = state.composer.plugin === plugin.dataset.plugin ? "" : plugin.dataset.plugin; save(); render(); return; }
      const goBtn = event.target.closest("[data-go]");
      if (goBtn) { state.navOpen = false; go(goBtn.dataset.go); return; }
      const decision = event.target.closest("[data-decision]");
      if (decision) { act(decision.dataset.decision, decision.dataset.id); return; }
      const button = event.target.closest("[data-act]");
      if (!button) return;
      if (button.dataset.act === "lang") { state.lang = button.dataset.lang === "en" ? "en" : "zh"; save(); render(); return; }
      if (button.dataset.act === "logout") { state.userId = null; state.loginError = ""; save(); go("/login"); return; }
      if (button.dataset.act === "menu") {
        if (window.matchMedia("(max-width: 768px)").matches) state.navOpen = !state.navOpen;
        else { state.sideHidden = false; state.navOpen = false; }
        save(); render(); return;
      }
      if (button.dataset.act === "hide-side") { state.sideHidden = true; state.navOpen = false; save(); render(); return; }
      if (button.dataset.act === "human") {
        const current = user();
        if (current) addMessage(current.id, "助手", "<p>" + (state.lang === "en" ? "Handed to a person. A colleague will continue in this assistant. This does not approve, dispatch, or stamp anything." : "已转人工。同事会在本助手里继续处理。这次不会自动批准、派工或签章。") + "</p>");
        save();
        go("/assistant");
        return;
      }
      if (button.dataset.act === "voice") { toggleVoice(); return; }
      if (button.dataset.act === "use-example") { state.composer.text = button.dataset.example || ""; state.composer.error = ""; save(); render(); return; }
      if (button.dataset.act === "new-task") {
        if (micSession) {
          const currentMic = micSession;
          micSession = null;
          currentMic.processor.onaudioprocess = null;
          currentMic.processor.disconnect();
          currentMic.source.disconnect();
          currentMic.gain.disconnect();
          currentMic.stream.getTracks().forEach((track) => track.stop());
          currentMic.ctx.close();
        }
        const current = user();
        if (current) state.messages[current.id] = [];
        state.selectedRecordId = "";
        state.navOpen = false;
        state.composer.text = "";
        state.composer.plugin = "";
        state.composer.fileNote = "";
        state.composer.voiceNote = "";
        state.composer.listening = false;
        state.composer.error = "";
        state.composer.askRemember = false;
        state.composer.busy = false;
        const memory = current ? (state.remembered || {})[current.id] : null;
        if (memory) {
          state.composer.proxy = current.proxy ? memory.ownerId : "";
          state.composer.project = memory.project;
          state.composer.attributionSet = true;
          state.composer.attributionSource = "已记住";
        } else {
          state.composer.proxy = "";
          state.composer.project = "";
          state.composer.attributionSet = false;
          state.composer.attributionSource = "";
        }
        save(); go("/assistant"); return;
      }
      if (button.dataset.act === "history-menu") {
        state.historyMenuId = state.historyMenuId === button.dataset.id ? "" : button.dataset.id;
        save(); render(); return;
      }
      if (button.dataset.act === "delete-history") {
        const id = button.dataset.id;
        state.records = state.records.filter((record) => record.id !== id);
        if (state.selectedRecordId === id) state.selectedRecordId = "";
        if (state.selectedReviewId === id) state.selectedReviewId = "";
        state.historyMenuId = "";
        save(); render(); return;
      }
      if (button.dataset.act === "open-record") { state.historyMenuId = ""; state.selectedRecordId = button.dataset.id; state.navOpen = false; save(); go("/assistant"); return; }
      if (button.dataset.act === "bind-owner") {
        const current = user();
        const customer = document.getElementById("bind-customer");
        const project = document.getElementById("bind-project");
        if (current && current.proxy && (!customer || !customer.value)) { state.composer.error = "请先选择客户。不能默认代选。"; save(); render(); return; }
        if (!project || !project.value) { state.composer.error = "请选择项目，或明确选择未分项目。"; save(); render(); return; }
        if (current && current.proxy) state.composer.proxy = customer.value;
        state.composer.project = project.value;
        state.composer.attributionSet = true;
        state.composer.attributionSource = "本次确定";
        state.composer.error = "";
        save(); render(); return;
      }
      if (button.dataset.act === "use-remembered") {
        const current = user();
        const memory = current && (state.remembered || {})[current.id];
        if (!current || !memory) return;
        state.composer.proxy = current.proxy ? memory.ownerId : "";
        state.composer.project = memory.project;
        state.composer.attributionSet = true;
        state.composer.attributionSource = "已记住";
        state.composer.error = "";
        save(); render(); return;
      }
      if (button.dataset.act === "change-owner") {
        const current = user();
        state.composer.attributionSet = false;
        state.composer.project = "";
        state.composer.attributionSource = "";
        if (current && current.proxy) state.composer.proxy = "";
        state.composer.error = "";
        save(); render(); return;
      }
      if (button.dataset.act === "remember-yes" || button.dataset.act === "remember-no") {
        const current = user();
        const kept = button.dataset.act === "remember-yes";
        if (current && kept && state.composer.attributionSet) {
          if (!state.remembered) state.remembered = {};
          state.remembered[current.id] = { ownerId: current.proxy ? state.composer.proxy : current.id, project: state.composer.project };
        }
        if (current) addMessage(current.id, "助手", "<p>" + esc(t(kept ? "已记住。下次可以沿用这一对客户和项目。已经生成的记录归属不变。" : "这次不记住。已经生成的记录归属不变。")) + "</p>");
        state.composer.askRemember = false;
        save(); render(); return;
      }
      if (button.dataset.act === "pick-review") { state.selectedReviewId = button.dataset.id; state.reviewDetail = true; save(); render(); return; }
      if (button.dataset.act === "back-list") { state.reviewDetail = false; save(); render(); return; }
      if (button.dataset.act === "resubmit") resubmit(button.dataset.id);
    });
    document.getElementById("app").addEventListener("mouseover", (event) => {
      const row = event.target.closest(".history-row");
      if (!row || row.dataset.marquee) return;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const title = row.querySelector(".history-title");
      const text = row.querySelector(".history-title-text");
      if (!title || !text) return;
      const distance = text.scrollWidth - title.clientWidth;
      if (distance <= 2) return;
      text.style.setProperty("--shift", "-" + distance + "px");
      title.style.textOverflow = "clip";
      text.style.animation = "history-marquee " + Math.max(3, distance / 36) + "s linear infinite";
      row.dataset.marquee = "1";
    });
    document.getElementById("app").addEventListener("mouseout", (event) => {
      const row = event.target.closest(".history-row");
      if (!row || (event.relatedTarget && row.contains(event.relatedTarget))) return;
      const text = row.querySelector(".history-title-text");
      if (text) text.style.animation = "";
      const title = row.querySelector(".history-title");
      if (title) title.style.textOverflow = "";
      delete row.dataset.marquee;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.historyMenuId) { state.historyMenuId = ""; save(); render(); }
    });
    document.getElementById("app").addEventListener("input", (event) => {
      if (event.target.id === "draft") state.composer.text = event.target.value;
      if (event.target.id === "email") state.email = event.target.value;
    });
    document.getElementById("app").addEventListener("change", (event) => {
      if (event.target.id === "file") {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (/fail/i.test(file.name)) { state.composer.fileNote = ""; state.composer.error = "解析失败：文件无法读取。可以移除后重试，或继续用文字发送。已写的内容还在。"; }
        else { state.composer.fileNote = file.name; state.composer.error = ""; }
        save(); render();
      }
    });
    document.getElementById("app").addEventListener("submit", (event) => {
      event.preventDefault();
      if (event.target.id === "login-form") {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const found = USERS[email];
        if (!found || password !== PASSWORD) { state.email = email; state.userId = null; state.loginError = "邮箱或口令不正确"; save(); render(); return; }
        state.email = email; state.userId = found.id; state.loginError = ""; save(); go("/dashboard"); return;
      }
      if (event.target.id === "send-form") {
        const draft = document.getElementById("draft");
        if (draft) state.composer.text = draft.value;
        onSend();
      }
    });
    window.addEventListener("hashchange", render);
    if (!location.hash) location.hash = "#/login";
    else render();
  </script>
</body>
</html>
